name: Remove drop cap
on: push
permissions:
  contents: write
jobs:
  apply:
    if: "github.actor != 'github-actions[bot]'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Neutralise the drop cap
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          import io
          p = 'assets/css/polish.css'
          c = io.open(p, encoding='utf-8').read()
          assert 'no drop cap' not in c, 'already applied'
          c = c.rstrip(chr(10)) + chr(10) + chr(10) + '/* ---------- no drop cap: first letter renders normally ---------- */' + chr(10) + '.about-copy>p:first-of-type::first-letter{font-size:inherit;font-weight:inherit;line-height:inherit;color:inherit;float:none;padding:0;}' + chr(10)
          io.open(p, 'w', encoding='utf-8').write(c)
          print('polish.css updated')
          PYEOF
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "No changes"; else
            git commit -m "Remove the oversized drop cap on the About paragraph"
            git push
          fi
