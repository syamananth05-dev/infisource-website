name: Typography scale
on: push
permissions:
  contents: write
jobs:
  apply:
    if: "github.actor != 'github-actions[bot]'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Raise the type scale
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          import io, re
          M = {'9':'10.5','9.5':'11','10':'11.5','10.5':'12','11':'12.5','11.5':'13','11.8':'13.5','12':'13.5','12.5':'14','13':'14','13.5':'14.5','14':'15','14.5':'15.5','15':'16','15.5':'16.5','16.5':'17','17':'18'}
          pat = re.compile(r'font-size:\s*([0-9]+(?:\.[0-9]+)?)px')
          def rep(m):
              v = m.group(1)
              return 'font-size:' + M[v] + 'px' if v in M else m.group(0)
          c = io.open('assets/css/style.css', encoding='utf-8').read()
          n = len(pat.findall(c))
          assert n == 84, 'expected 84 font-size declarations, got %d' % n
          io.open('assets/css/style.css', 'w', encoding='utf-8').write(pat.sub(rep, c))
          print('style.css: rewrote', n, 'font-size declarations')
          v = io.open('vendor.html', encoding='utf-8').read()
          o1 = 'font-size:clamp(21px,2.4vw,27px);'
          n1 = 'font-size:clamp(23px,2.6vw,29px);'
          assert v.count(o1) == 1, 'vendor h2 not found'
          io.open('vendor.html', 'w', encoding='utf-8').write(v.replace(o1, n1))
          print('vendor.html: h2 bumped')
          PYEOF
      - name: Commit updated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "No changes"; else
            git commit -m "Raise site typography scale for readability across all devices"
            git push
          fi
