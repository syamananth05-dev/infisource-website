name: Larger header brand
on: push
permissions:
  contents: write
jobs:
  apply:
    if: "github.actor != 'github-actions[bot]'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Append brand sizing to polish.css
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          import io
          B1 = [
              "",
              "/* ---------- header brand: a touch larger / more dominant ---------- */",
              ".brand{font-size:27px;}",
              ".brand img{width:58px;height:58px;}",
              "@media(max-width:520px){.brand{font-size:20px;}.brand img{width:44px;height:44px;}}",
              "@media(max-width:380px){.brand{font-size:17px;}.brand img{width:38px;height:38px;}}",
          ]
          B2 = [
              "",
              "/* ---------- header fit with the larger brand ---------- */",
              "@media(max-width:760px){.nav>.btn{display:none;}}",
              "@media(max-width:340px){.brand{font-size:16px;}.brand img{width:34px;height:34px;}.theme-btn{width:32px;height:32px;}.burger{width:36px;height:36px;}}",
          ]
          p = 'assets/css/polish.css'
          c = io.open(p, encoding='utf-8').read()
          assert 'header brand: a touch larger' not in c, 'already applied'
          c = c.rstrip(chr(10)) + chr(10) + chr(10).join(B1) + chr(10)
          c = c.rstrip(chr(10)) + chr(10) + chr(10).join(B2) + chr(10)
          io.open(p, 'w', encoding='utf-8').write(c)
          print('polish.css updated')
          PYEOF
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "No changes"; else
            git commit -m "Enlarge the header brand a notch; keep header balanced on all widths"
            git push
          fi
