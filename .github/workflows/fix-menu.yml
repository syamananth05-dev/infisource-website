name: Fix mobile menu

on: push

permissions:
  contents: write

jobs:
  apply:
    if: "github.actor != 'github-actions[bot]'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply mobile drawer fixes
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          css = open('assets/css/style.css').read()
          css_subs = [
            ("@media(max-width:1060px){\n  nav.links{display:none;}",
             "@media(max-width:1060px){\n  .nav>nav.links{display:none;}"),
            (".drawer nav a:hover{color:var(--orange);}",
             ".drawer nav a:hover{color:var(--orange);}\n.drawer nav a.drawer-cta{margin-top:12px;background:var(--orange);color:#fff;font-weight:800;border-bottom:none;border-radius:12px;padding:13px 10px;text-align:center;letter-spacing:.04em;text-transform:uppercase;font-size:12.5px;box-shadow:0 10px 20px -8px rgba(237,112,20,.5);}\n.drawer nav a.drawer-cta:hover{background:var(--orange-deep);color:#fff;transform:translateY(-1px);}"),
          ]
          for old, new in css_subs:
              assert css.count(old) == 1, 'CSS MISS: ' + old[:60]
              css = css.replace(old, new)
          open('assets/css/style.css', 'w').write(css)
          js = open('assets/js/shared.js').read()
          js_old = "    var drawer = d.createElement('div'); drawer.className = 'drawer';\n    drawer.appendChild(nav.cloneNode(true));"
          js_new = """    var drawer = d.createElement('div'); drawer.className = 'drawer';
    var dnav = nav.cloneNode(true);
    var vcta = d.createElement('a');
    vcta.href = 'vendor.html';
    vcta.className = 'drawer-cta';
    vcta.textContent = 'Vendor Registration';
    dnav.appendChild(vcta);
    drawer.appendChild(dnav);"""
          assert js.count(js_old) == 1, 'JS MISS'
          js = js.replace(js_old, js_new)
          open('assets/js/shared.js', 'w').write(js)
          print('menu fixes applied OK')
          PYEOF
      - name: Commit updated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "No changes"; else
            git commit -m "Fix mobile drawer menu: show all pages plus vendor CTA"
            git push
          fi
