name: Hamburger menu on every device
on: push
permissions:
  contents: write
jobs:
  apply:
    if: "github.actor != 'github-actions[bot]'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Append menu rules to polish.css
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          import io
          MENU = [
              "",
              "/* ---------- hamburger menu on every device ---------- */",
              ".burger{display:block;}",
              ".nav>nav.links{display:none;}",
              ".drawer{padding:18px 28px 26px;max-height:calc(100vh - 96px);overflow:auto;}",
              ".drawer nav{max-width:1160px;margin:0 auto;display:grid;grid-template-columns:1fr;gap:10px;}",
              "@media(min-width:641px) and (max-width:1023px){",
              "  .drawer nav{grid-template-columns:1fr 1fr;gap:11px;}",
              "  .drawer nav a:last-child{grid-column:1 / -1;}",
              "}",
              "@media(min-width:1024px){",
              "  .drawer nav{grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;}",
              "  .drawer nav a{font-size:15px;padding:14px 15px;}",
              "}",
          ]
          p = 'assets/css/polish.css'
          c = io.open(p, encoding='utf-8').read()
          assert 'hamburger menu on every device' not in c, 'already applied'
          c = c.rstrip(chr(10)) + chr(10) + chr(10).join(MENU) + chr(10)
          io.open(p, 'w', encoding='utf-8').write(c)
          print('polish.css updated')
          PYEOF
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "No changes"; else
            git commit -m "Show hamburger menu on every device; format drawer per width"
            git push
          fi
