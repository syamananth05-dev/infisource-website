name: Uniform mobile menu

on: push

permissions:
  contents: write

jobs:
  apply:
    if: "github.actor != 'github-actions[bot]'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply uniform drawer styling
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          css = open('assets/css/style.css').read()
          css_subs = [
            ('padding:8px 28px 22px;box-shadow:0 26px 40px -24px rgba(27,26,24,.3);animation:drawerIn',
             'padding:14px 28px 20px;box-shadow:0 26px 40px -24px rgba(27,26,24,.3);animation:drawerIn'),
            ('.drawer nav{display:flex;flex-direction:column;}',
             '.drawer nav{display:flex;flex-direction:column;gap:9px;}'),
            ('.drawer nav a{padding:13px 2px;font-weight:700;font-size:15px;border-bottom:1px solid var(--line);color:var(--grey-700);}\n.drawer nav a:last-child{border-bottom:none;}\n.drawer nav a:hover{color:var(--orange);}\n.drawer nav a.drawer-cta{margin-top:12px;background:var(--orange);color:#fff;font-weight:800;border-bottom:none;border-radius:12px;padding:13px 10px;text-align:center;letter-spacing:.04em;text-transform:uppercase;font-size:12.5px;box-shadow:0 10px 20px -8px rgba(237,112,20,.5);}\n.drawer nav a.drawer-cta:hover{background:var(--orange-deep);color:#fff;transform:translateY(-1px);}',
             '.drawer nav a{display:flex;align-items:center;justify-content:space-between;margin-left:0;padding:13px 16px;border:1px solid var(--line);border-radius:12px;\n  background:var(--white);font-weight:700;font-size:15px;color:var(--grey-700);\n  transition:border-color .22s var(--ease),background .22s var(--ease),color .22s var(--ease),transform .22s var(--ease);}\n.drawer nav a::after{content:"";position:static;left:auto;right:auto;bottom:auto;background:none;border-radius:0;width:7px;height:7px;border-right:2px solid var(--grey-300);border-top:2px solid var(--grey-300);transform:rotate(45deg);\n  transition:border-color .22s var(--ease),transform .22s var(--ease);}\n.drawer nav a:hover{border-color:var(--orange);color:var(--ink);transform:translateX(3px);}\n.drawer nav a:hover::after{border-color:var(--orange);}\n.drawer nav a.page-on{border-color:var(--orange);background:var(--orange-tint);color:var(--ink);}\n.drawer nav a.page-on::after{border-color:var(--orange);}'),
            ('.vf-layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:42px;align-items:start;}\n@media(max-width:1020px){.vf-layout{grid-template-columns:1fr;}}',
             '.vf-layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:42px;align-items:start;}\n.vf-layout>*{min-width:0;}\n.vf-card{min-width:0;}\n@media(max-width:1020px){.vf-layout{grid-template-columns:minmax(0,1fr);}}'),
          ]
          for old, new in css_subs:
              assert css.count(old) == 1, 'CSS MISS: ' + old[:60]
              css = css.replace(old, new)
          open('assets/css/style.css', 'w').write(css)
          js = open('assets/js/shared.js').read()
          js_old = "    vcta.className = 'drawer-cta';"
          js_new = "    if (/(^|\\/)vendor\\.html$/.test(location.pathname)) vcta.className = 'page-on';"
          assert js.count(js_old) == 1, 'JS MISS'
          js = js.replace(js_old, js_new)
          open('assets/js/shared.js', 'w').write(js)
          print('uniform menu applied OK')
          PYEOF
      - name: Commit updated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "No changes"; else
            git commit -m "Uniform mobile menu: identical card rows on all pages"
            git push
          fi
