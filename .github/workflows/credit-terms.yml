name: Credit terms
on: push
permissions:
  contents: write
jobs:
  apply:
    if: "github.actor != 'github-actions[bot]'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update credit terms hint
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          import io
          p = 'vendor.html'
          c = io.open(p, encoding='utf-8').read()
          old = 'InfiSource typically works on 30-45 day credit terms with verified vendors.'
          new = 'InfiSource typically works on 30-60 day credit terms with verified vendors.'
          assert c.count(old) == 1, 'not found'
          io.open(p, 'w', encoding='utf-8').write(c.replace(old, new))
          print('credit terms updated')
          PYEOF
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "No changes"; else
            git commit -m "Update vendor credit terms to 30-60 days"
            git push
          fi
