name: Brand name and Private Limited
on: push
permissions:
  contents: write
jobs:
  apply:
    if: "github.actor != 'github-actions[bot]'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalise brand name and drop Private Limited
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          import io
          Q = chr(34)
          PVT_OLD = 'InfiSource Global Private Limited'
          PVT_NEW = 'InfiSource Global'
          SPAN_OLD = '<span>INFISOURCE <span class=' + Q + 'accent' + Q + '>GLOBAL</span></span>'
          SPAN_NEW = '<span>InfiSource <span class=' + Q + 'accent' + Q + '>Global</span></span>'
          FB_OLD = '<div class=' + Q + 'fb-name' + Q + '>INFISOURCE GLOBAL</div>'
          FB_NEW = '<div class=' + Q + 'fb-name' + Q + '>InfiSource Global</div>'
          for f in ['index.html', 'about.html', 'services.html', 'contact.html', 'vendor.html']:
              c = io.open(f, encoding='utf-8').read()
              c = c.replace(PVT_OLD, PVT_NEW)
              assert c.count(SPAN_OLD) == 1, f + ' span'
              c = c.replace(SPAN_OLD, SPAN_NEW)
              assert c.count(FB_OLD) == 1, f + ' fb'
              c = c.replace(FB_OLD, FB_NEW)
              assert 'INFISOURCE' not in c, f + ' caps left'
              io.open(f, 'w', encoding='utf-8').write(c)
              print('updated', f)
          p = 'assets/css/polish.css'
          css = io.open(p, encoding='utf-8').read()
          assert 'brand name is mixed case now' not in css
          css = css.rstrip(chr(10)) + chr(10) + chr(10) + '/* ---------- brand name is mixed case now: tighten tracking ---------- */' + chr(10) + '.foot-brand .fb-name{letter-spacing:.04em;}' + chr(10)
          io.open(p, 'w', encoding='utf-8').write(css)
          print('polish.css updated')
          PYEOF
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "No changes"; else
            git commit -m "Brand name in normal case; remove Private Limited from the name"
            git push
          fi
