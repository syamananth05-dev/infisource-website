name: Desktop menu panel polish
on: push
permissions:
  contents: write
jobs:
  apply:
    if: "github.actor != 'github-actions[bot]'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upgrade the desktop menu panel
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          import io
          MENU2 = [
              "",
              "/* ---------- desktop menu panel: premium finish ---------- */",
              ".drawer nav a{margin-left:0;white-space:normal;}",
              "@media(min-width:1024px){",
              "  body.menu-open::before{content:'';position:fixed;inset:0;background:rgba(16,15,14,.5);",
              "    -webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);z-index:29;animation:drawerIn .3s var(--ease);}",
              "  .drawer{padding:26px 28px 32px;box-shadow:inset 0 1px 0 rgba(237,112,20,.32),0 34px 64px -32px rgba(0,0,0,.55);}",
              "  .drawer nav{max-width:1124px;gap:14px;}",
              "  .drawer nav a{padding:24px 20px;font-size:16px;font-weight:600;border-radius:16px;",
              "    box-shadow:0 16px 32px -24px rgba(27,26,24,.5);animation:cardIn .45s var(--ease-out) backwards;}",
              "  .drawer nav a:nth-child(2){animation-delay:.05s;}",
              "  .drawer nav a:nth-child(3){animation-delay:.1s;}",
              "  .drawer nav a:nth-child(4){animation-delay:.15s;}",
              "  .drawer nav a:nth-child(5){animation-delay:.2s;}",
              "  .drawer nav a:hover{transform:translateY(-3px);border-color:var(--orange);",
              "    box-shadow:0 24px 44px -26px rgba(237,112,20,.6);}",
              "  .drawer nav a::after{width:9px;height:9px;border-right-color:var(--grey-500);border-top-color:var(--grey-500);}",
              "  .drawer nav a:hover::after{transform:translateX(3px) rotate(45deg);}",
              "}",
              "@media(min-width:1024px) and (max-width:1180px){.drawer nav a{font-size:14.5px;padding:20px 14px;}}",
              "@keyframes cardIn{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:none;}}",
          ]
          JS = [
              "/* InfiSource Global - menu behaviour: close on outside click / Escape */",
              "(function(){",
              "  var d = document;",
              "  function close(){ d.body.classList.remove('menu-open'); }",
              "  d.addEventListener('click', function(e){",
              "    if (!d.body.classList.contains('menu-open')) return;",
              "    if (e.target && e.target.closest && e.target.closest('.drawer, .burger')) return;",
              "    close();",
              "  });",
              "  d.addEventListener('keydown', function(e){ if (e.key === 'Escape') close(); });",
              "})();",
          ]
          p = 'assets/css/polish.css'
          c = io.open(p, encoding='utf-8').read()
          assert 'desktop menu panel: premium finish' not in c, 'already applied'
          c = c.rstrip(chr(10)) + chr(10) + chr(10).join(MENU2) + chr(10)
          io.open(p, 'w', encoding='utf-8').write(c)
          print('polish.css updated')
          io.open('assets/js/menu.js', 'w', encoding='utf-8').write(chr(10).join(JS) + chr(10))
          print('menu.js created')
          Q = chr(34)
          night = '<script src=' + Q + 'assets/js/night.js' + Q + '></script>'
          tag = '<script src=' + Q + 'assets/js/menu.js' + Q + '></script>'
          for f in ['index.html', 'about.html', 'services.html', 'contact.html', 'vendor.html']:
              h = io.open(f, encoding='utf-8').read()
              assert h.count(night) == 1 and 'menu.js' not in h, f
              io.open(f, 'w', encoding='utf-8').write(h.replace(night, night + chr(10) + tag))
          print('script tag added to 5 pages')
          PYEOF
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "No changes"; else
            git commit -m "Premium desktop menu panel: backdrop, depth, hover lift, close on outside click"
            git push
          fi
